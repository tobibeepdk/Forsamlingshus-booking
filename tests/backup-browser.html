<!doctype html><html lang="da"><meta charset="utf-8"><title>Backup integration tests</title><h1>Backup integration tests</h1><pre id="results">Running…</pre><script src="../data.js"></script><script src="../backup.js"></script><script>
(async()=>{
 const results=[],out=document.querySelector('#results'),assert=(value,message)=>{if(!value)throw new Error(message);};
 const key='hjortemosen_data_v1',prefix='qa-backup-'+Date.now(),base={bookings:[],renters:[],blacklist:[],settings:{memberPrice:1000,friendPrice:1500,deposit:500}};
 const seed=n=>JSON.stringify({...base,renters:n?[{id:'r1',name:'QA '+n}]:[]});
 function store(initial=seed(1)){const values=new Map([[key,initial]]);return {getItem:k=>values.get(k)??null,setItem:(k,v)=>values.set(k,String(v)),removeItem:k=>values.delete(k)};}
 async function check(label,body){try{await body();results.push('PASS '+label);}catch(e){results.push('FAIL '+label+': '+e.message);}out.textContent=results.join('\n');}
 await check('real IndexedDB commit and reopen retain the full snapshot',async()=>{const s=store(),m=HjortBackup.create({storage:s,dbName:prefix+'-reopen',appVersion:'2.5.0'});await m.flush();s.setItem('hjortemosen_booking_draft_v1',JSON.stringify({name:'QA draft',price:'',deposit:'500'}));await m.flush();const reopened=HjortBackup.create({storage:s,dbName:prefix+'-reopen'}),list=await reopened.list(),copy=await reopened.read('latest');assert(list.length===1,'one latest copy');assert(copy.backup.drafts.booking.name==='QA draft','draft retained in IndexedDB');assert(copy.renters[0].name==='QA 1','saved data retained');});
 await check('data commits keep the previous state for recovery',async()=>{const s=store(),m=HjortBackup.create({storage:s,dbName:prefix+'-archive'});await m.flush();s.setItem(key,seed(2));await m.flush(true);const list=await m.list();assert(list.length===2,'current plus previous');const old=await m.read(list.find(x=>x.id!=='latest').id);assert(old.renters[0].name==='QA 1','previous version archived');});
 await check('draft changes update latest without filling history with keystrokes',async()=>{const s=store(),m=HjortBackup.create({storage:s,dbName:prefix+'-drafts'});await m.flush();for(let i=0;i<5;i++){s.setItem('hjortemosen_booking_draft_v1',JSON.stringify({name:'QA '+i}));await m.flush();}assert((await m.list()).length===1,'no keystroke history');assert((await m.read('latest')).backup.drafts.booking.name==='QA 4','last draft saved');});
 await check('corrupt source preserves the last good automatic copy',async()=>{const s=store(),states=[],m=HjortBackup.create({storage:s,dbName:prefix+'-corrupt',onStatus:s=>states.push(s)});await m.flush();s.setItem(key,'{bad');await m.flush();assert((await m.read('latest')).renters[0].name==='QA 1','last good backup preserved');assert(states.at(-1).state==='error','failure reported');});
 await check('missing primary data never replaces a populated backup with defaults',async()=>{const s=store(),m=HjortBackup.create({storage:s,dbName:prefix+'-missing'});await m.flush();s.removeItem(key);await m.flush();assert((await m.read('latest')).renters[0].name==='QA 1','populated backup retained');});
 await check('queued writes retain their order and latest state',async()=>{const s=store(),m=HjortBackup.create({storage:s,dbName:prefix+'-queue'});const first=m.flush();s.setItem(key,seed(2));const second=m.flush(true);s.setItem(key,seed(3));const third=m.flush(true);await Promise.all([first,second,third]);assert((await m.read('latest')).renters[0].name==='QA 3','latest not overwritten by slower write');assert((await m.list()).length===3,'prior states retained');});
 await check('history stays bounded while keeping the newest versions',async()=>{const s=store(),m=HjortBackup.create({storage:s,dbName:prefix+'-retention'});await m.flush();for(let i=2;i<=14;i++){s.setItem(key,seed(i));await m.flush(true);}const list=await m.list();assert(list.length===11,'latest plus ten prior copies');assert((await m.read('latest')).renters[0].name==='QA 14','latest retained');const names=[];for(const item of list)names.push((await m.read(item.id)).renters[0].name);assert(names.includes('QA 13')&&!names.includes('QA 1'),'oldest safely pruned');});
 await check('unavailable IndexedDB reports error without damaging primary data',async()=>{const s=store(),before=s.getItem(key),states=[],m=HjortBackup.create({storage:s,indexedDB:null,dbName:prefix+'-blocked',onStatus:s=>states.push(s)});await m.flush();assert(states.at(-1).state==='error','backup failure visible');assert(s.getItem(key)===before,'autosave unaffected');});
 await check('missing primary data preserves a backup containing custom settings only',async()=>{const s=store(JSON.stringify({...base,settings:{...base.settings,memberPrice:1200}})),m=HjortBackup.create({storage:s,dbName:prefix+'-settings-only'});await m.flush();s.removeItem(key);await m.flush();assert((await m.read('latest')).settings.memberPrice===1200,'custom settings backup retained');});
 await check('two managers never replace current workspace backup with an older queued capture',async()=>{const s=store(),name=prefix+'-two-managers',a=HjortBackup.create({storage:s,dbName:name}),b=HjortBackup.create({storage:s,dbName:name});await a.flush();await b.flush();s.setItem(key,seed(2));const first=a.flush();s.setItem(key,seed(3));const older=a.flush();s.setItem(key,seed(4));const newer=b.flush();await Promise.all([first,older,newer]);assert((await a.read('latest')).renters[0].name==='QA 4','latest equals current shared workspace');});
 await check('superseded queued captures cannot grow history past ten copies',async()=>{const s=store(seed(99)),m=HjortBackup.create({storage:s,dbName:prefix+'-stale-retention'});await m.flush();const pending=[];for(let i=1;i<=15;i++){s.setItem(key,seed(i));pending.push(m.flush());}s.setItem(key,seed(99));await Promise.all(pending);assert((await m.list()).length<=11,'latest plus bounded history');assert((await m.read('latest')).renters[0].name==='QA 99','current workspace retained');});
 await check('recovery in a second context cannot roll back a live successful restore',async()=>{const source=store(seed(2));source.setItem('hjortemosen_booking_draft_v1',JSON.stringify({name:'QA new draft'}));const copy=HjortBackup.capture('2.5.0',source),target=store(seed(1));let recovery=null,triggered=false;const originalSet=target.setItem;target.setItem=(k,v)=>{originalSet(k,v);if(k===key&&!triggered){triggered=true;recovery=HjortBackup.recover(target);}};await HjortBackup.apply(copy,target);await recovery;assert(JSON.parse(target.getItem(key)).renters[0].name==='QA 2','restore stays committed');assert(JSON.parse(target.getItem('hjortemosen_booking_draft_v1')).name==='QA new draft','matching draft committed');assert(target.getItem('hjortemosen_restore_journal_v1')===null,'no incomplete journal');});
 out.textContent=results.join('\n')+'\n'+results.filter(x=>x.startsWith('PASS')).length+'/'+results.length+' passed';
})();</script></html>
